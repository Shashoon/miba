type User @model @auth(rules: [{allow: public}]) {
  id: ID!
  first_name: String!
  last_name: String!
  email: String!
  cellphone: String
  skills: [String]
  roomsIds: [String]
}

type Message @model @auth(rules: [{allow: public}]) {
  id: ID!
  content: String!
  sender: String!
  createdAt: AWSDateTime!
  chatID: ID! @index(name: "byChat")
}

type Chat @model @auth(rules: [{allow: public}]) {
  id: ID!
  title: String!
  imageUrl: String
  messages: [Message] @hasMany(indexName: "byChat", fields: ["id"])
}

type Room @model @auth(rules: [{allow: public}]) {
  id: ID!
  name: String!
  description: String
  imageUrl: String
  createdAt: AWSDateTime!
  members: [String]
}
